<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#141412" />
    <title>FLIT 축제 앱</title>
    <link rel="preconnect" href="https://mqrafomyngxsixakbnzu.supabase.co" crossorigin />
    <!-- 글꼴 CSS 는 화면 그리기를 막지 않게 뒤에서 받는다 — CDN 이 느린 회선에서 첫 화면이 통째로 늦어졌다 (2026-11-12) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" crossorigin media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 첫 화면(#splash)·Building 대기 화면 공용 -->
    <style>
      .sp-ring{width:36px;height:36px;border-radius:50%;border:4px solid #e5e7eb;border-top-color:#111827;animation:sp-spin .9s linear infinite}
      .sp-lines{position:relative;width:260px;height:28px}
      .sp-lines span{position:absolute;inset:0;text-align:center;font-size:18px;font-weight:700;opacity:0;animation:sp-line 8s infinite}
      .sp-lines span:nth-child(2){animation-delay:2s}.sp-lines span:nth-child(3){animation-delay:4s}.sp-lines span:nth-child(4){animation-delay:6s}
      @keyframes sp-spin{to{transform:rotate(360deg)}}
      @keyframes sp-line{0%{opacity:0}4%,21%{opacity:1}25%,100%{opacity:0}}
    </style>
  </head>
  <body class="bg-white text-gray-900">
    <div id="root">
      <!-- 첫 화면 — JS 번들이 내려오기 전(QR 을 찍고 처음 들어올 때)에 흰 화면 대신 보인다. React 가 뜨면 통째로 바뀐다. 문구는 src/components/ui.tsx 의 Building 과 맞춘다 -->
      <div id="splash" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111827">
        <div class="sp-ring"></div>
        <div class="sp-lines"><span>행사장 짓는 중…</span><span>부스 세우는 중…</span><span>푸드트럭 자리 잡는 중…</span><span>지도 펼치는 중…</span></div>
        <p style="margin:0;font-size:13px;color:#6b7280">잠시만 기다려 주세요</p>
      </div>
      <script>if(/^\/(admin|s|h|vo|v|board)(\/|$)/.test(location.pathname))document.getElementById('splash').remove()</script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
