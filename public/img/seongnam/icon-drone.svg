<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e0f7"/>
      <stop offset="1" stop-color="#6fc3ea"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeed4"/>
      <stop offset="1" stop-color="#eacb9a"/>
    </linearGradient>
    <linearGradient id="rotor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6f0dc"/>
      <stop offset="1" stop-color="#7fcfae"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ea"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f5f7a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f5f7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 물 -->
  <rect width="200" height="200" fill="url(#water)"/>
  <!-- 모래 띠 (리플렛의 사선 지면) -->
  <path d="M0 0 H200 V58 L0 112 Z" fill="url(#sand)"/>
  <path d="M0 112 L200 58 V72 L0 126 Z" fill="#d9b985" opacity="0.55"/>
  <!-- 잔물결 -->
  <path d="M18 160 q10 -6 20 0 t20 0" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  <path d="M140 178 q10 -6 20 0 t20 0" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  <!-- 그림자 -->
  <ellipse cx="100" cy="150" rx="44" ry="12" fill="url(#shadow)"/>
  <!-- 팔 -->
  <g stroke="#9fb3bb" stroke-width="7" stroke-linecap="round">
    <line x1="100" y1="104" x2="58" y2="82"/>
    <line x1="100" y1="104" x2="142" y2="82"/>
    <line x1="100" y1="104" x2="58" y2="126"/>
    <line x1="100" y1="104" x2="142" y2="126"/>
  </g>
  <!-- 로터 4개 -->
  <g>
    <ellipse cx="52" cy="80" rx="28" ry="11" fill="url(#rotor)" stroke="#5fb894" stroke-width="2"/>
    <ellipse cx="148" cy="80" rx="28" ry="11" fill="url(#rotor)" stroke="#5fb894" stroke-width="2"/>
    <ellipse cx="52" cy="128" rx="28" ry="11" fill="url(#rotor)" stroke="#5fb894" stroke-width="2"/>
    <ellipse cx="148" cy="128" rx="28" ry="11" fill="url(#rotor)" stroke="#5fb894" stroke-width="2"/>
    <circle cx="52" cy="80" r="3.5" fill="#4a9f7e"/>
    <circle cx="148" cy="80" r="3.5" fill="#4a9f7e"/>
    <circle cx="52" cy="128" r="3.5" fill="#4a9f7e"/>
    <circle cx="148" cy="128" r="3.5" fill="#4a9f7e"/>
  </g>
  <!-- 본체 -->
  <rect x="74" y="88" width="52" height="34" rx="14" fill="url(#body)" stroke="#b9c7cd" stroke-width="2"/>
  <rect x="82" y="92" width="36" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="100" cy="106" r="7" fill="#ef4a4a"/>
  <circle cx="98" cy="104" r="2.2" fill="#ffffff" opacity="0.8"/>
  <!-- 카메라 -->
  <rect x="92" y="120" width="16" height="9" rx="4" fill="#5b6b73"/>
</svg>
