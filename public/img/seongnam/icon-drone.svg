<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="rotor" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d9f6e8"/>
      <stop offset="1" stop-color="#86d1b2"/>
    </radialGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="82" x2="0" y2="124">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde5ea"/>
    </linearGradient>
  </defs>
  <!-- 흰 배경 + 검정 윤곽 네모 -->
  <rect width="200" height="200" fill="#ffffff"/>
  <rect x="5" y="5" width="190" height="190" rx="30" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <!-- 팔 (X자) -->
  <g stroke="#111111" stroke-width="10" stroke-linecap="round">
    <line x1="100" y1="102" x2="54" y2="78"/>
    <line x1="100" y1="102" x2="146" y2="78"/>
    <line x1="100" y1="102" x2="54" y2="126"/>
    <line x1="100" y1="102" x2="146" y2="126"/>
  </g>
  <!-- 로터 4개 -->
  <g fill="url(#rotor)" stroke="#111111" stroke-width="5">
    <ellipse cx="48" cy="76" rx="30" ry="12"/>
    <ellipse cx="152" cy="76" rx="30" ry="12"/>
    <ellipse cx="48" cy="128" rx="30" ry="12"/>
    <ellipse cx="152" cy="128" rx="30" ry="12"/>
  </g>
  <g fill="#111111">
    <circle cx="48" cy="76" r="4"/>
    <circle cx="152" cy="76" r="4"/>
    <circle cx="48" cy="128" r="4"/>
    <circle cx="152" cy="128" r="4"/>
  </g>
  <!-- 본체 -->
  <rect x="70" y="84" width="60" height="36" rx="18" fill="url(#body)" stroke="#111111" stroke-width="5"/>
  <ellipse cx="88" cy="92" rx="11" ry="3.5" fill="#ffffff"/>
  <circle cx="100" cy="102" r="8" fill="#ee4b4b" stroke="#111111" stroke-width="3"/>
  <!-- 카메라 -->
  <rect x="90" y="120" width="20" height="12" rx="6" fill="#111111"/>
  <circle cx="100" cy="126" r="3" fill="#9fe3ff"/>
</svg>
