<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="white" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="170">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e0e6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5364"/>
      <stop offset="1" stop-color="#1f303a"/>
    </linearGradient>
    <radialGradient id="mint" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d2f3e6"/>
      <stop offset="1" stop-color="#7cc9ad"/>
    </radialGradient>
  </defs>
  <!-- 흰 배경 + 검정 윤곽 네모 -->
  <rect width="200" height="200" fill="#ffffff"/>
  <rect x="5" y="5" width="190" height="190" rx="30" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <!-- 꼬리 (안테나형) -->
  <path d="M46 92 q-14 -10 -8 -28" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="38" cy="62" r="6" fill="#ee4b4b" stroke="#111111" stroke-width="3"/>
  <!-- 뒤쪽 다리 2개 (회색, 몸통 뒤) -->
  <g fill="#c5cfd7" stroke="#111111" stroke-width="4" stroke-linejoin="round">
    <rect x="70" y="120" width="13" height="26" rx="6"/>
    <rect x="72" y="142" width="11" height="22" rx="5"/>
    <rect x="126" y="120" width="13" height="26" rx="6"/>
    <rect x="128" y="142" width="11" height="22" rx="5"/>
  </g>
  <!-- 앞쪽 다리 2개 (흰색) -->
  <g fill="url(#white)" stroke="#111111" stroke-width="5" stroke-linejoin="round">
    <rect x="54" y="120" width="14" height="28" rx="7"/>
    <rect x="52" y="144" width="12" height="22" rx="6"/>
    <rect x="110" y="120" width="14" height="28" rx="7"/>
    <rect x="108" y="144" width="12" height="22" rx="6"/>
  </g>
  <!-- 발 -->
  <g fill="#111111">
    <rect x="48" y="163" width="20" height="8" rx="4"/>
    <rect x="104" y="163" width="20" height="8" rx="4"/>
    <rect x="70" y="162" width="16" height="7" rx="3.5"/>
    <rect x="126" y="162" width="16" height="7" rx="3.5"/>
  </g>
  <!-- 몸통 -->
  <rect x="50" y="86" width="100" height="44" rx="20" fill="url(#white)" stroke="#111111" stroke-width="5"/>
  <rect x="64" y="96" width="44" height="8" rx="4" fill="#c5cfd7"/>
  <circle cx="132" cy="108" r="9" fill="url(#mint)" stroke="#111111" stroke-width="3"/>
  <circle cx="132" cy="108" r="3.5" fill="#ee4b4b"/>
  <!-- 목 -->
  <rect x="128" y="72" width="22" height="22" rx="8" fill="#c5cfd7" stroke="#111111" stroke-width="4"/>
  <!-- 머리 -->
  <rect x="124" y="46" width="52" height="40" rx="16" fill="url(#white)" stroke="#111111" stroke-width="5"/>
  <!-- 귀 -->
  <path d="M130 50 l-4 -16 l14 10 z" fill="url(#mint)" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <path d="M166 50 l6 -16 l-14 10 z" fill="url(#mint)" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
  <!-- 바이저 눈 -->
  <rect x="140" y="56" width="32" height="16" rx="8" fill="url(#face)" stroke="#111111" stroke-width="3"/>
  <circle cx="160" cy="64" r="4" fill="#7fe9ff"/>
  <circle cx="150" cy="64" r="2.5" fill="#7fe9ff" opacity="0.7"/>
  <!-- 코 -->
  <circle cx="172" cy="76" r="4" fill="#111111"/>
  <!-- 하이라이트 -->
  <ellipse cx="68" cy="92" rx="9" ry="3" fill="#ffffff" transform="rotate(-10 68 92)"/>
</svg>
