  <ellipse cx="88" cy="70" rx="7" ry="8" fill="#7fe9ff"/>
  <ellipse cx="112" cy="70" rx="7" ry="8" fill="#7fe9ff"/>
  <circle cx="85.5" cy="67" r="2.2" fill="#ffffff"/>
  <circle cx="109.5" cy="67" r="2.2" fill="#ffffff"/>
  <path d="M93 81 q7 5 14 0" fill="none" stroke="#7fe9ff" stroke-width="3" stroke-linecap="round"/>
  <!-- 하이라이트 -->
  <ellipse cx="74" cy="46" rx="9" ry="3.5" fill="#ffffff" transform="rotate(-20 74 46)"/>
