  <line x1="100" y1="38" x2="100" y2="26" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="22" r="7" fill="#ee4b4b" stroke="#111111" stroke-width="3"/>
  <!-- 귀 -->
  <ellipse cx="54" cy="70" rx="9" ry="13" fill="url(#mint)" stroke="#111111" stroke-width="4"/>
  <ellipse cx="146" cy="70" rx="9" ry="13" fill="url(#mint)" stroke="#111111" stroke-width="4"/>
  <!-- 팔 -->
  <rect x="38" y="112" width="20" height="42" rx="10" fill="url(#white)" stroke="#111111" stroke-width="4"/>
  <rect x="142" y="112" width="20" height="42" rx="10" fill="url(#white)" stroke="#111111" stroke-width="4"/>
  <!-- 발 -->
  <rect x="68" y="160" width="24" height="14" rx="7" fill="#c5cfd7" stroke="#111111" stroke-width="4"/>
  <rect x="108" y="160" width="24" height="14" rx="7" fill="#c5cfd7" stroke="#111111" stroke-width="4"/>
  <!-- 몸통 -->
  <rect x="60" y="104" width="80" height="60" rx="24" fill="url(#white)" stroke="#111111" stroke-width="5"/>
  <circle cx="100" cy="134" r="15" fill="url(#mint)" stroke="#111111" stroke-width="4"/>
  <circle cx="100" cy="134" r="6" fill="#ee4b4b"/>
  <!-- 머리 -->
  <rect x="58" y="38" width="84" height="64" rx="28" fill="url(#white)" stroke="#111111" stroke-width="5"/>
