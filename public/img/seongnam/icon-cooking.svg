<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#f1e9dd"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#e2c08a"/>
      <stop offset="1" stop-color="#b48a4c"/>
    </radialGradient>
    <!-- 모자 전체에 같은 좌표계로 그라데이션을 걸어 여러 도형이 한 덩어리로 보이게 -->
    <linearGradient id="puff" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="124">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8ee"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="146">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="1" stop-color="#d6dde5"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a3f18" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5a3f18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 원판 -->
  <ellipse cx="100" cy="114" rx="80" ry="76" fill="url(#shadow)"/>
  <circle cx="100" cy="100" r="72" fill="url(#disc)"/>
  <!-- 모자 그림자 -->
  <ellipse cx="100" cy="150" rx="36" ry="6" fill="#4a3312" opacity="0.22"/>
  <!-- 모자 윗부분: 선 없이 원 3개 + 몸통을 같은 그라데이션으로 -->
  <g fill="url(#puff)">
    <circle cx="70" cy="94" r="22"/>
    <circle cx="130" cy="94" r="22"/>
    <circle cx="100" cy="76" r="28"/>
    <rect x="62" y="94" width="76" height="30"/>
  </g>
  <!-- 윗부분 아래쪽 음영 -->
  <path d="M62 124 H138 V118 Q100 128 62 118 Z" fill="#c9d2dc" opacity="0.6"/>
  <!-- 띠 -->
  <rect x="64" y="120" width="72" height="26" rx="9" fill="url(#band)"/>
  <rect x="64" y="120" width="72" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  <!-- 하이라이트 -->
  <ellipse cx="88" cy="64" rx="10" ry="5" fill="#ffffff" opacity="0.95" transform="rotate(-25 88 64)"/>
  <circle cx="72" cy="88" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
