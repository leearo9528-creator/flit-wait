<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="1000" fill="#f4f2ec"/>
  <!-- 산책로 -->
  <path d="M400 1000 V820 M400 820 H150 V560 M400 820 H650 V560 M150 560 H650 M400 560 V330 M150 560 V330 H650 V560" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400 1000 V820 M400 820 H150 V560 M400 820 H650 V560 M150 560 H650 M400 560 V330 M150 560 V330 H650 V560" fill="none" stroke="#d9d5cb" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>
  <!-- 눈썰매 슬로프 -->
  <rect x="60" y="50" width="680" height="240" rx="28" fill="#e3e8f4"/>
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M150 80 V260"/><path d="M230 80 V260"/><path d="M310 80 V260"/><path d="M390 80 V260"/>
    <path d="M520 120 V260"/><path d="M590 120 V260"/><path d="M660 120 V260"/>
  </g>
  <text x="80" y="42" font-size="22" font-weight="700" fill="#4b5563">눈썰매 슬로프</text>
  <!-- 체험 존 -->
  <rect x="190" y="370" width="170" height="150" rx="22" fill="#e9e6de"/>
  <text x="206" y="394" font-size="18" font-weight="700" fill="#4b5563">체험 존</text>
  <!-- 얼음 광장 -->
  <ellipse cx="525" cy="445" rx="95" ry="75" fill="#e3e8f4"/>
  <text x="525" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="#4b5563">얼음 광장</text>
  <!-- 푸드 존 -->
  <rect x="445" y="600" width="170" height="180" rx="22" fill="#e9e6de"/>
  <text x="461" y="628" font-size="18" font-weight="700" fill="#4b5563">푸드 존</text>
  <!-- 마켓 거리 -->
  <rect x="185" y="600" width="170" height="180" rx="22" fill="#e9e6de"/>
