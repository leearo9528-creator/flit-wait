  <!-- 나무 -->
  <g fill="#e2e6da"><circle cx="60" cy="350" r="22"/><circle cx="50" cy="700" r="26"/><circle cx="740" cy="640" r="24"/><circle cx="730" cy="820" r="28"/><circle cx="620" cy="900" r="22"/><circle cx="90" cy="470" r="18"/></g>
</svg>
