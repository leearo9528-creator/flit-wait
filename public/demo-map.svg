  <rect x="690" y="380" width="80" height="150" rx="18" fill="#e9e6de"/>
  <text x="730" y="500" text-anchor="middle" font-size="18" font-weight="700" fill="#4b5563">무대</text>
  <!-- 주차 -->
  <rect x="30" y="860" width="250" height="110" rx="20" fill="#e9e6de"/>
  <text x="155" y="950" text-anchor="middle" font-size="18" font-weight="700" fill="#4b5563">주차장</text>
